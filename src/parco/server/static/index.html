<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parco review</title>
<link rel="stylesheet" href="/static/style.css">
<script>
  window.MathJax = {
    tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"]], tags: "ams" },
    startup: { typeset: false },
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
<script defer src="/static/app.js"></script>
</head>
<body>
<header id="topbar">
  <div class="brand">parco <span id="project-name"></span></div>
  <div id="status-line"></div>
  <div id="counts"></div>
  <nav id="tabs" role="tablist">
    <button class="tab" type="button" role="tab" data-tab="document">Document</button>
    <button class="tab" type="button" role="tab" data-tab="global">Global comments <span id="global-count" class="badge"></span></button>
  </nav>
  <div id="view-controls">
    <label title="Show only pending edits and open threads (p)"><input type="checkbox" id="pending-only"> Pending only</label>
    <button id="collapse-all" class="button" type="button">Collapse all</button>
    <button id="expand-all" class="button" type="button">Expand all</button>
  </div>
  <button id="close-button" class="button danger" hidden>Close version</button>
</header>
<div id="banner" hidden></div>
<main id="review">
  <article id="doc" aria-label="Document"></article>
  <aside id="cards" aria-label="Edits and discussions"></aside>
  <aside id="global" aria-label="Global comments">
    <h2>Global comments</h2>
    <div id="global-threads"></div>
    <form id="global-form" class="compose">
      <textarea name="body" rows="3" placeholder="New global comment" data-draft="global-new"></textarea>
      <button class="button" type="submit">Comment</button>
    </form>
  </aside>
</main>
<button id="comment-fab" class="button primary" hidden title="Comment on the selection (c)">Comment</button>
<form id="selection-form" class="popover compose" hidden>
  <blockquote id="selection-quote"></blockquote>
  <textarea name="body" rows="3" placeholder="Your comment on the selection" data-draft="selection-new"></textarea>
  <div class="actions">
    <button class="button" type="button" data-action="cancel">Cancel</button>
    <button class="button primary" type="submit">Comment</button>
  </div>
</form>
<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <div id="modal-content"></div>
    <div id="modal-actions" class="actions"></div>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
</body>
</html>
